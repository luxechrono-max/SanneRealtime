name: Build SanneRealtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          xcrun clang \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -mios-version-min=18.2 \
            -framework AVFAudio \
            -framework Foundation \
            -fobjc-arc \
            SanneRealtime/SanneRealtime.m \
            -o SanneRealtime.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SanneRealtime-dylib
          path: SanneRealtime.dylib
